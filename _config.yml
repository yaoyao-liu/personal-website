# ------------------------------------------------------------------
# Basic information
# ------------------------------------------------------------------
title: Your Name
# title_native: 姓名                 # optional, shown in a lighter font next to your name
position: Assistant Professor
affiliation: Your University
affiliation_link: https://www.example.edu/
affiliation_logo: assets/img/logo.svg   # logo in the top bar (white artwork works best on the dark bar)
email: your.name (at) example.edu

# Departments / units listed under your position on every page.
# "note" is appended in parentheses, e.g. "(affiliate)". Delete the list to hide it.
departments:
  - name: Department of Computer Science
    link: https://cs.example.edu/
  - name: Institute for Artificial Intelligence
    link: https://ai.example.edu/
    note: affiliate

# ------------------------------------------------------------------
# Search engine optimization (SEO)
# ------------------------------------------------------------------
keywords: your name, research, your university
canonical: https://www.example.edu/~yourname   # site root, no trailing slash
description: Your Name is an assistant professor at Your University working on machine learning and computer vision.

# ------------------------------------------------------------------
# Options
# ------------------------------------------------------------------
enable_last_update: false   # print the page's last-modified date under the content
link_type: text             # text = labelled pills under your name; icon = icons only
pub_archive_year: 2022      # publications from this year and earlier share one "and Before" heading; delete to disable

# ------------------------------------------------------------------
# Links (delete a line to hide that button)
# ------------------------------------------------------------------
google_scholar: https://scholar.google.com/citations?user=XXXXXXXXXXXX
dblp: https://dblp.org/pid/00/0000.html
# cv_link: https://www.example.edu/~yourname/cv.pdf
# github_link: https://github.com/username
# linkedin: https://www.linkedin.com/in/username/
# twitter: https://twitter.com/username
# bluesky: https://bsky.app/profile/username.bsky.social

# ------------------------------------------------------------------
# Images
# ------------------------------------------------------------------
# A path relative to the site root, or an absolute https URL.
# Use an absolute URL if you want the photo to appear in social-media previews.
avatar: assets/img/placeholder.svg

# ------------------------------------------------------------------
# Optional extras
# ------------------------------------------------------------------
# Extra stylesheets loaded after the theme, e.g. your university's brand CSS.
# extra_css:
#   - https://www.example.edu/brand.css

# Short note printed at the bottom of the home page.
footnote: Feel free to use the source code of this website.
footnote_link: https://github.com/username/repository

# Legal links shown in the footer.
# imprint: https://www.example.edu/imprint
# data_protection: https://www.example.edu/privacy

# Visitor maps. Only set these if you have your own account,
# otherwise your visitors are counted towards somebody else's map.
# clustrmaps_id:
# mapmyvisitors_id:

# ------------------------------------------------------------------
# Files that are not copied to the generated website
# ------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
